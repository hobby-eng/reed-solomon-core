name: CI

# The fast checks (CI-04): the formatting, the lints of every feature set, and the tests with the
# buffers in protected pages and in the allocator's memory.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these checks on the tagged commit before it packages it.
  workflow_call:

# A newer push to the same branch or pull request makes a running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gates of AGENTS.md on x86-64 Linux, and the lint of the browser and mobile targets.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DPRINT: "0.63.0"
      DPRINT_SHA256: f58b5d7c13ccd613cfa264f1ae82d4e5db1373f8fe20462bc1126051d111b0ce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      # dprint formats the Markdown, JSON, TOML and YAML; dprint.json pins its plugins with their
      # SHA-256.
      - name: Install dprint, checked against its SHA-256
        run: |
          archive="dprint-x86_64-unknown-linux-gnu.zip"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/dprint/dprint/releases/download/$DPRINT/$archive"
          echo "$DPRINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/dprint"
          echo "$RUNNER_TEMP/dprint" >> "$GITHUB_PATH"
      - name: Check the formatting
        run: |
          cargo fmt --check
          dprint check
      - name: Lint every feature set
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --no-default-features --features alloc --all-targets -- -D warnings
          cargo clippy --locked --no-default-features -- -D warnings
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          for target in aarch64-linux-android aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo clippy --locked --all-targets --target "$target" -- -D warnings
          done
      - name: Lint a target without an operating system
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo clippy --locked --no-default-features --target thumbv7em-none-eabihf -- -D warnings
          cargo clippy --locked --no-default-features --features alloc --target thumbv7em-none-eabihf -- -D warnings
      - name: Check and lint the fuzz targets
        run: |
          cargo fmt --check --manifest-path fuzz/Cargo.toml
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Run the tests, buffers in protected pages
        run: cargo test --locked
      - name: Run the tests, buffers in the allocator's memory
        run: cargo test --locked --no-default-features --features alloc
      - name: Run the unit tests and the self-test without an allocator
        run: cargo test --locked --no-default-features
      - name: Check the documentation with and without an allocator
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps
          cargo doc --locked --no-deps --no-default-features

  # The browser build in a WebAssembly engine: the self-test's known answers, a set written and
  # rebuilt with its buffers in the allocator's memory, and the strict mode's refusal.
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Format-check, lint and build the WebAssembly checks
        run: |
          cargo fmt --manifest-path wasm/Cargo.toml --check
          cargo clippy --locked --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
          cargo build --locked --release --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Run the WebAssembly checks in Node
        run: node wasm/run.mjs wasm/target/wasm32-unknown-unknown/release/reed_solomon_core_wasm_checks.wasm

  # The tests on each other system the crate runs on natively: the protected pages are made by
  # other calls on each of them.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Run the tests
        run: cargo test --locked
