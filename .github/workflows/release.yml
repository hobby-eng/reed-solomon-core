name: Release provenance

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every check of CI on the tagged commit itself: a tag whose checks fail gets no package and no
  # attestation.
  ci:
    uses: ./.github/workflows/ci.yml

  # The three lockfiles against the RustSec advisories, on the tagged commit.
  audit:
    uses: ./.github/workflows/audit.yml

  # Products and inverses take the same time whatever their elements, in every kind of field, as
  # the compiled code shows: a tag whose arithmetic depends on the values gets no package.
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Time products and inverses on fixed and random values
        run: cargo run --locked --release --no-default-features --features alloc --example timing

  # Each fuzz target for 90 seconds under the sanitizer, the files target from whole sets: a tag on
  # which one finds a fault gets no package.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-11-13 --profile minimal
          cargo +nightly-2026-11-13 install cargo-fuzz --locked --version 0.13.2
      - name: Run every fuzz target for 90 seconds
        run: |
          set -euo pipefail
          # The fuzz workspace's own lockfile, unchanged: cargo-fuzz has no --locked of its own.
          cargo +nightly-2026-11-13 fetch --locked --manifest-path fuzz/Cargo.toml
          cargo +nightly-2026-11-13 run --locked --manifest-path fuzz/Cargo.toml --example seeds \
            --target x86_64-unknown-linux-gnu -- fuzz/corpus/files
          targets=$(sed -n '/^\[\[bin\]\]$/,/^path/ s/^name = "\(.*\)"$/\1/p' fuzz/Cargo.toml)
          test -n "$targets"
          for target in $targets; do
            cargo +nightly-2026-11-13 fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu \
              "$target" -- -max_total_time=90 -rss_limit_mb=3000 -max_len=4096
          done
          # cargo-fuzz could have resolved anew: the results count only for the checked-in graph.
          git diff --exit-code -- fuzz/Cargo.lock
      - name: Keep the inputs of a fault
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  package:
    needs: [ci, audit, timing, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package the tagged crate and verify its build
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "reed-solomon-core") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"
          cargo package --locked
          crate="reed-solomon-core-$version.crate"
          tar -xOzf "target/package/$crate" "reed-solomon-core-$version/.cargo_vcs_info.json" |
            jq -e --arg commit "$(git rev-parse HEAD)" '.git.sha1 == $commit and (.git.dirty != true)'
          mkdir release
          cp "target/package/$crate" release/
          cd release
          sha256sum "$crate" > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: release/
          if-no-files-found: error

  attest:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release/*.crate"

      - name: Verify the package against the release tag and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set -- release/*.crate
          test "$#" -eq 1
          gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
