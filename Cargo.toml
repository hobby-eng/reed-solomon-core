[package]
name = "reed-solomon-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Reed-Solomon coding for sets of shards: any k of n rebuild the data; repair, extend, check and correct a set"
license = "MIT OR Apache-2.0"
# Not published while the shard file format is a draft.
publish = false

[features]
default = ["protect"]
# Owned results: whole-shard helpers, error correction and the writing of shard files. Without it
# the crate allocates nothing and works on the caller's buffers.
alloc = ["zeroize/alloc", "dep:bytemuck"]
# The owned results and the working buffers of bytes that follow from data lie in pages of their
# own, between guard pages, which the system is asked to lock and to keep out of core dumps and
# child processes. Without it they lie in the allocator's memory, and are wiped all the same.
# It brings the standard library.
protect = ["alloc", "dep:secret-protection-core"]

[dependencies]
# SHA-256 of the data: computed when a set is written and compared when it is rebuilt. RustCrypto,
# without its default features: no allocation, no OID tables; its state is wiped when dropped.
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
# Wiping every buffer that held data or values that follow from it, and the wrapper the owned
# results come in, which wipes itself when dropped.
zeroize = { version = "=1.9.1", default-features = false }
# Pages for data that may be a secret, and the isolation of the process that holds it: the release
# 0.1.0 from crates.io, the package its signed GitHub release v0.1.0 attests.
secret-protection-core = { version = "=0.1.0", optional = true }
# The bytes of a buffer seen as the numbers of two bytes the decoders keep, so that their lists lie
# in the same pages as the data, without unsafe code of this crate's own.
bytemuck = { version = "=1.25.2", optional = true }

# The suite and the measuring program take the owned calls: without an allocator `cargo test`
# runs the unit tests and the self-test alone.
[[test]]
name = "suite"
path = "tests/suite/main.rs"
required-features = ["alloc"]

# The strict mode in a process of its own, whose lock limit no other test uses up.
[[test]]
name = "strict"
path = "tests/strict/main.rs"
required-features = ["protect"]

[[example]]
name = "measure"
required-features = ["alloc"]

[dev-dependencies]
# An independent Reed–Solomon implementation: the expected bytes of the oracle tests, in both fields.
reed-solomon-erasure = "=6.0.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny" # at 150 lines, CORE-15
mod_module_files = "deny" # RUST-03
undocumented_unsafe_blocks = "deny" # RUST-07
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# No index or slice that could panic: `get`, iterators and fixed-size chunks instead. The few table
# lookups say at their place why they stay in range.
indexing_slicing = "deny"

# The exhaustive tests run every choice of shards; unoptimized they take minutes.
[profile.test]
opt-level = 2
