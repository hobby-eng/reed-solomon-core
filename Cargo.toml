[package]
name = "reed-solomon-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Reed-Solomon coding for sets of shards: any k of n rebuild the data; repair, extend, check and correct a set"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hobby-eng/reed-solomon-core"
documentation = "https://docs.rs/reed-solomon-core"
readme = "README.md"
keywords = ["reed-solomon", "erasure-coding", "error-correction", "shards", "no-std"]
categories = ["algorithms", "encoding", "no-std"]
# The audit records, CI and the fuzz targets stay in the repository.
exclude = ["/docs/audits/", "/.github/", "/fuzz/", "/AGENTS.md"]

[features]
default = ["protect"]
# Owned results: whole-shard helpers, error correction and the writing of shard files. Without it
# the crate allocates nothing and works on the caller's buffers.
alloc = ["zeroize/alloc", "dep:bytemuck"]
# The owned results and the working buffers of bytes that follow from data lie in pages of their
# own, between guard pages, which the system is asked to lock and to keep out of core dumps and
# child processes, and every call that works on data overwrites a fixed window of the stack
# below it afterwards, best effort.
# Without it they lie in the allocator's memory, and are wiped all the same. It brings the
# standard library.
protect = ["alloc", "dep:secret-protection-core"]

[dependencies]
# Compatible requirements, as a library on crates.io takes them: a program can resolve the later
# patch releases of these crates and their fixes, with the versions its other dependencies need.
# Cargo.lock holds the versions the tests ran with. A program that takes secret-protection-core
# from crates.io, as this crate does, shares one copy of it (and one from a path or git only when
# it patches crates-io to that source).
# SHA-256 of the data: computed when a set is written and compared when it is rebuilt. RustCrypto,
# without its default features: no allocation, no OID tables; its state is wiped when dropped.
sha2 = { version = "0.11.1", default-features = false, features = ["zeroize"] }
# Wiping every buffer that held data or values that follow from it, and the wrapper the owned
# results come in, which wipes itself when dropped.
zeroize = { version = "1.9.1", default-features = false }
# Pages for data that may be a secret, and the isolation of the process that holds it, which the
# program enters once, with the same copy of the crate (`reed_solomon_core::protect`). At least
# 0.2.0, the line whose `OpenChannels` changed; `protect` passes it on, so this crate's own version
# moves with its lines. The strict mode rests on it, yet it is not pinned exactly: its patch
# releases come from the same workspace with audits of their own, and an exact pin would keep their
# fixes from every program that uses this crate.
secret-protection-core = { version = "0.2.0", optional = true }
# The bytes of a buffer seen as the numbers of two bytes the decoders keep, so that their lists lie
# in the same pages as the data, without unsafe code of this crate's own.
bytemuck = { version = "1.25.2", optional = true }

# The suite and the measuring program take the owned calls: without an allocator `cargo test`
# runs the unit tests and the self-test alone.
[[test]]
name = "suite"
path = "tests/suite/main.rs"
required-features = ["alloc"]

# The strict mode in a process of its own, whose lock limit no other test uses up.
[[test]]
name = "strict"
path = "tests/strict/main.rs"
required-features = ["protect"]

[[example]]
name = "measure"
required-features = ["alloc"]

# Products and inverses take the same time whatever their elements; the release workflow runs it.
[[example]]
name = "timing"
required-features = ["alloc"]

[dev-dependencies]
# An independent Reed–Solomon implementation: the expected bytes of the oracle tests, in both fields.
reed-solomon-erasure = "=6.0.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny" # at 150 lines, CORE-15
mod_module_files = "deny" # RUST-03
undocumented_unsafe_blocks = "deny" # RUST-07
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# No index or slice that could panic: `get`, iterators and fixed-size chunks instead. The few table
# lookups say at their place why they stay in range.
indexing_slicing = "deny"

# The exhaustive tests run every choice of shards; unoptimized they take minutes.
[profile.test]
opt-level = 2
