[package]
name = "reed-solomon-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
reed-solomon-core = { path = ".." }

# Bytes that claim to be shard files: reading, sorting into sets and every call on a set.
[[bin]]
name = "files"
path = "fuzz_targets/files.rs"
test = false
doc = false
bench = false

# A set written by the crate and then damaged: what comes back is the data, or a refusal, the
# same in a buffer and in place.
[[bin]]
name = "sets"
path = "fuzz_targets/sets.rs"
test = false
doc = false
bench = false

# Shards with wrong and marked symbols: a plan that is applied leaves a set that agrees.
[[bin]]
name = "plans"
path = "fuzz_targets/plans.rs"
test = false
doc = false
bench = false

# Every public call that takes numbers, lengths or bytes, given any of them.
[[bin]]
name = "calls"
path = "fuzz_targets/calls.rs"
test = false
doc = false
bench = false

# Words of the cyclic code with any roots, wrong and marked symbols: what is put right is a word.
[[bin]]
name = "cyclic"
path = "fuzz_targets/cyclic.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

# The table of every crate (RUST-01). A fuzz target answers by stopping the run: each one allows
# unwraps and panics at its top, with the reason.
[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Its own workspace: the crate under test stays a crate without one.
[workspace]
