[package]
name = "reed-solomon-core-wasm-checks"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
reed-solomon-core = { path = ".." }

# A module that Node loads with no imports; run.mjs calls its exports and counts the checks.
[lib]
crate-type = ["cdylib"]

# Each export needs `#[unsafe(no_mangle)]`, which it expects with its reason; no unsafe block.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[workspace]
