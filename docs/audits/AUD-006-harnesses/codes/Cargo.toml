[package]
name = "aud006-codes-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
# The crate's default feature set (page-protected buffers), as a program like MHFE would use it.
protect = ["reed-solomon-core/protect"]

[dependencies]
reed-solomon-core = { path = "../../../..", default-features = false, features = ["alloc"] }

[profile.release]
debug = false
overflow-checks = true
debug-assertions = true
