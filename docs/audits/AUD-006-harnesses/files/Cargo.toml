[package]
name = "aud006-files-probe"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["protect"]
protect = ["reed-solomon-core/protect"]
alloc = ["reed-solomon-core/alloc"]

[dependencies]
reed-solomon-core = { path = "../../../..", default-features = false }

[profile.dev]
opt-level = 1
overflow-checks = true
debug-assertions = true

[profile.release]
overflow-checks = true
debug-assertions = true

[workspace]
