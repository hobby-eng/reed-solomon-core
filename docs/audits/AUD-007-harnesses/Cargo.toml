[package]
name = "aud007-remediation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["protect"]
protect = ["reed-solomon-core/protect"]

[dependencies]
reed-solomon-core = { path = "../../..", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
